name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Backend regressions
        run: python -m unittest discover -s backend/tests -q
      - name: Download and cache utilities (offline tests)
        run: python -m unittest discover -s scripts/tests -q
      - name: Check source release contents
        run: python scripts/check_source_release.py
      - name: Check shell syntax
        run: bash -n start.sh setup.sh && find scripts -name '*.sh' -exec bash -n {} +
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:i18n
